  /api/v1/jobs/{job_id}/cancel:
    post:
      tags:
      - public-api
      summary: Cancel Job
      description: 'Cancel a pending/running job.


        Cancellation surfaces as ``status=failed`` with ``error.code=cancelled``

        (there is no separate ``cancelled`` status). Idempotent: cancelling an

        already-terminal job returns its current state unchanged.'
      operationId: cancel_job_api_v1_jobs__job_id__cancel_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '400':
