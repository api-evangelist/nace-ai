  /api/v1/jobs:
    get:
      tags:
      - public-api
      summary: List Jobs
      description: List the tenant's jobs, newest first (summaries only — no result payloads).
      operationId: list_jobs_api_v1_jobs_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Jobs per page.
          default: 50
          title: Limit
        description: Jobs per page.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: '``next_cursor`` from the previous page; omit for the newest page.'
          title: Cursor
        description: '``next_cursor`` from the previous page; omit for the newest page.'
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(pending|running|succeeded|failed)$
          - type: 'null'
          description: Optional status filter.
          title: Status
        description: Optional status filter.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
