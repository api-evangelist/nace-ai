            $ref: '#/components/schemas/GroundItemResult'
          type: array
          title: Results
        total_items_found:
          type: integer
          title: Total Items Found
          default: 0
        total_items_requested:
          type: integer
          title: Total Items Requested
          default: 0
        duration_ms:
          type: integer
          title: Duration Ms
          default: 0
      type: object
      title: GroundResult
    FileInput:
      properties:
        source_url:
          type: string
          title: Source Url
          description: '``s3://bucket/key``, ``https://`` (presigned/public), or ``ndi://file/<uuid>`` from ``POST /upload``.'
        file_name:
          anyOf:
          - type: string
          - type: 'null'
          title: File Name
          description: Original filename; used to infer the format. Required for ``s3://`` / ``https://``. Optional for ``ndi://file/<uuid>`` (defaults to the name captured at upload; a provided value overrides inference only).
      additionalProperties: false
      type: object
      required:
      - source_url
      title: FileInput
      description: The document to process.
    ParsedTable:
      properties:
        item_type:
          type: string
          const: table
          title: Item Type
          default: table
        sheets:
          items:
            $ref: '#/components/schemas/ParsedSheet'
          type: array
          title: Sheets
      type: object
      title: ParsedTable
    SpreadsheetRangeMatch:
      properties:
        match_type:
          type: string
          const: spreadsheet_range
          title: Match Type
          default: spreadsheet_range
        sheet_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Sheet Name
        cell_range:
          type: string
          title: Cell Range
        confidence:
          type: number
          title: Confidence
          default: 1.0
        matched_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Matched Text
      type: object
      required:
      - cell_range
      title: SpreadsheetRangeMatch
    TaxonomyCategory:
      properties:
        key:
          type: string
          title: Key
          description: Stable category key, e.g. 'general_ledger'.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Shown to the classifier; improves accuracy.
      additionalProperties: false
      type: object
      required:
      - key
      title: TaxonomyCategory
    CategorizedSheet:
      properties:
        kind:
          type: string
          const: sheet
          title: Kind
          default: sheet
        file_name:
          type: string
          title: File Name
        sheet_name:
          type: string
          title: Sheet Name
        categories:
          items:
            type: string
          type: array
          title: Categories
        has_freeform_categories:
          type: boolean
          title: Has Freeform Categories
          default: false
        summary:
          type: string
          title: Summary
        markdown_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Markdown Url
      type: object
      required:
      - file_name
      - sheet_name
      - categories
      - summary
      title: CategorizedSheet
    Taxonomy:
      properties:
        categories:
          items:
            $ref: '#/components/schemas/TaxonomyCategory'
          type: array
          minItems: 1
          title: Categories
      additionalProperties: false
      type: object
      required:
      - categories
      title: Taxonomy
    GroundDerivedSources:
      properties:
        markdown_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Markdown Url
          description: Markdown from a prior parse of the same file.
        transcript_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Transcript Url
          description: Transcript derived from the source media.
        jsonl_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Jsonl Url
          description: JSONL artifact derived from the source.
      additionalProperties: false
      type: object
      title: GroundDerivedSources
      description: Artifacts from prior NDI runs that speed up / improve grounding.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
