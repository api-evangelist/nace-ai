aid: nace-ai
name: Nace Ai
description: >-
  Nace.AI builds specialized AI models and agents that run enterprise business
  processes end-to-end on small models customers control. Its NAVI product
  automates workflows across financial auditing, loan processing, billing,
  accounts payable, and claims. Nace Document Intelligence (NDI) is its public
  API: an API-key REST + MCP service that parses documents to high-fidelity
  markdown, categorizes contents against a taxonomy, grounds values to precise
  page coordinates, and extracts schema-shaped structured JSON via async jobs.
